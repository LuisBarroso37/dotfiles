# lazygit config → stowed to ~/.config/lazygit/config.yml
# (found there because XDG_CONFIG_HOME is set in zsh/.zshenv; without it lazygit
# would read ~/Library/Application Support/lazygit on macOS).
# Reference: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

os:
  # Open files from lazygit (`e`, or clicking a hyperlink) in the CURRENT window
  # of the parent Neovim, not a new tab. Snacks sets editPreset=nvim-remote, whose
  # default uses `--remote-tab` (new tab); we mirror it but swap in `--remote`,
  # which does `:edit` in the current window. `--remote-send "q"` first closes the
  # lazygit float. Falls back to a fresh nvim when run outside Neovim ($NVIM unset).
  edit: '[ -z "$NVIM" ] && nvim -- {{filename}} || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && nvim +{{line}} -- {{filename}} || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'

git:
  # Multiple pagers, cycled in the diff view with the `|` key (cyclePagers).
  # First entry is the default. The catppuccin theme comes from ~/.config/git/config
  # (delta reads it automatically); here we only vary the layout so `|` toggles
  # side-by-side <-> unified. --paging=never because lazygit does its own paging;
  # the hyperlinks make a file:line clickable to open it in your editor.
  # --hunk-header-style=omit hides the hunk header. Its "enclosing symbol" comes
  # from git's @@ context line, which git guesses with a weak language regex (no
  # real TypeScript driver), so it's often wrong/misleading. Line numbers already
  # show in the gutter, so the header adds nothing.
  pagers:
    - pager: delta --paging=never --side-by-side --hunk-header-style=omit --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - pager: delta --paging=never --hunk-header-style=omit --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
