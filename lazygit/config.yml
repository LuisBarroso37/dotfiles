# lazygit config → stowed to ~/.config/lazygit/config.yml
# (found there because XDG_CONFIG_HOME is set in zsh/.zshenv; without it lazygit
# would read ~/Library/Application Support/lazygit on macOS).
# Reference: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

git:
  # Multiple pagers, cycled in the diff view with the `|` key (cyclePagers).
  # First entry is the default. The catppuccin theme comes from ~/.config/git/config
  # (delta reads it automatically); here we only vary the layout so `|` toggles
  # side-by-side <-> unified. --paging=never because lazygit does its own paging;
  # the hyperlinks make a file:line clickable to open it in your editor.
  # --hunk-header-style drops the redundant file path (you already picked the file
  # in lazygit) while keeping the line number + enclosing symbol as context.
  pagers:
    - pager: delta --paging=never --side-by-side --hunk-header-style="line-number syntax" --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - pager: delta --paging=never --hunk-header-style="line-number syntax" --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
