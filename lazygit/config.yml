# lazygit config → stowed to ~/.config/lazygit/config.yml
# (found there because XDG_CONFIG_HOME is set in zsh/.zshenv; without it lazygit
# would read ~/Library/Application Support/lazygit on macOS).
# Reference: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

os:
  # Open files from lazygit (`e`, or clicking a hyperlink) in the CURRENT window
  # of the parent Neovim, not a new tab. Snacks sets editPreset=nvim-remote, whose
  # default uses `--remote-tab` (new tab); we mirror it but swap in `--remote`,
  # which does `:edit` in the current window. `--remote-send "q"` first closes the
  # lazygit float. Falls back to a fresh nvim when run outside Neovim ($NVIM unset).
  edit: '[ -z "$NVIM" ] && nvim -- {{filename}} || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  # --remote + --remote-send are separate processes with no synchronisation: the
  # `:line` command can fire before the buffer is loaded. Use a single --remote-send
  # with :e +line filename — one atomic Vim command, no race.
  editAtLine: '[ -z "$NVIM" ] && nvim +{{line}} -- {{filename}} || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote-send ":e +{{line}} {{filename}}<CR>")'
git:
  # Two diff renderers, cycled in the diff view with `|` (cycleDiffRenderers);
  # `\` reverses it (cycleDiffRenderersReverse). The `name` shows in the diff
  # header so you can see which mode is active.
  #
  # 1) delta. Only the lazygit-specific args live here: --paging=never (lazygit
  #    does its own paging), --hunk-header-style=omit (git's "enclosing symbol"
  #    guess uses a weak regex with no real TS driver, so it's often wrong, and
  #    line numbers already show in the gutter), and the lazygit-edit:// link
  #    format that makes file:line clickable back into the parent Neovim.
  #    side-by-side, hyperlinks and the catppuccin theme are NOT repeated here —
  #    delta reads git config itself, so they come from ~/.config/git/config and
  #    are configured in one place.
  # 2) type: rawGit — git's own diff output with no renderer in between. With no
  #    `args` that is plain `git diff`, i.e. the unified view, which is what `|`
  #    toggles back to. (The other types are `extDiff`, a git external diff
  #    command, and `stdinFilter`, a pager fed the diff on stdin. `colorArg` is
  #    documented as stdinFilter-only, so it is omitted — and `always` is its
  #    default regardless.)
  diffRenderers:
    - name: side-by-side (delta)
      command: delta --paging=never --hunk-header-style=omit --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - name: unified (native)
      type: rawGit
