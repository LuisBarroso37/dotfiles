# Atuin — shell history. Only the deviations from atuin's own defaults are here.
#
# This used to be a copy of upstream's fully-commented example config: ~370 lines
# of documentation around the settings below. That copy was a snapshot, so its
# "## Defaults to X" comments described whatever atuin shipped on the day it was
# taken, not the installed version — and an [ai] section added later landed
# between the [ui] header and the commented `columns` setting it documents, so
# uncommenting that would have silently put a ui key under [ai].
# For the current, accurate list: https://docs.atuin.sh/latest/configuration/config/
# (the un-versioned /configuration/config/ path 404s since 18.18.0 — the docs site
# moved behind a /latest/ prefix. Worth keeping correct: this pointer being dead is
# why a key removed upstream sat in this file unnoticed.)

# Enter runs the command immediately; Tab puts it on the prompt for editing.
enter_accept = true

# Fuzzy search served by the daemon below rather than by a per-invocation sqlite
# open — noticeably faster on a large history.
search_mode = "daemon-fuzzy"

[daemon]
# Persistent background process keeping the history DB open — what makes
# `daemon-fuzzy` above worth using. autostart means no service manager needed.
enabled = true
autostart = true

[ai]
# The `?` key generates a command from a natural-language description. Off by
# default upstream; enabled here for that one purpose. The opening request is
# minimal already — [ai.opening] send_cwd and send_last_command both default to
# false, so they are left unset.
#
# The capability pins below are the point of this section. As of 18.19.0 the
# assistant can *request* four further capabilities — history search, stored
# command output, file read/write, bash execution — and each one, left unset,
# defaults to "enabled, and the ai will ask for permission", with requests going
# to Atuin's hosted endpoint unless [ai] endpoint is overridden. On a machine
# whose shell history is thousands of commands run against regulated production
# systems, "there is a prompt" is not an adequate control: one distracted `y`
# ships sensitive context to a third party. So they are pinned off explicitly
# rather than left to a default upstream is free to change. Command generation
# itself needs none of them.
#
# All of it is dormant until `atuin login` — there is no sync account on this
# machine (`atuin doctor` reports "sync": null) and the hosted assistant needs
# one. Pinning before login is the right order: after it, an unset capability is
# live on the first prompt.
enabled = true

[ai.capabilities]
enable_history_search = false
enable_history_output = false
enable_file_tools = false
enable_command_execution = false
