# Atuin — shell history. Only the deviations from atuin's own defaults are here.
#
# This used to be a copy of upstream's fully-commented example config: ~370 lines
# of documentation around the settings below. That copy was a snapshot, so its
# "## Defaults to X" comments described whatever atuin shipped on the day it was
# taken, not the installed version — and an [ai] section added later landed
# between the [ui] header and the commented `columns` setting it documents, so
# uncommenting that would have silently put a ui key under [ai].
# For the current, accurate list: https://docs.atuin.sh/configuration/config/

# Enter runs the command immediately; Tab puts it on the prompt for editing.
enter_accept = true

# Fuzzy search served by the daemon below rather than by a per-invocation sqlite
# open — noticeably faster on a large history.
search_mode = "daemon-fuzzy"

[sync]
# Sync v2. The default for new installs; set explicitly so behaviour doesn't
# depend on when a given machine was first set up.
records = true

[daemon]
# Persistent background process keeping the history DB open — what makes
# `daemon-fuzzy` above worth using. autostart means no service manager needed.
enabled = true
autostart = true

[ai]
# The `?` key generates a command from a natural-language description. Off by
# default. Atuin sends only OS and shell name/version, not shell history.
enabled = true
