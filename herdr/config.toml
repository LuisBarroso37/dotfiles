# Herdr configuration — https://herdr.dev/docs/configuration/

[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+a"
previous_agent = "prefix+shift+k"
next_agent = "prefix+shift+j"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[worktrees]
# Fixed directory for all worktree checkouts.
# Pattern: <directory>/<repo>/<branch-slug>
directory = "~/.herdr/worktrees"
