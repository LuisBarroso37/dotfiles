onboarding = false
# Herdr configuration — https://herdr.dev/docs/configuration/
#
# `onboarding = false` above the header is herdr's own write-back, not hand
# edits. chezmoi deploys a copy of this file, so anything herdr writes shows up
# in `chezmoi diff`. In particular `herdr config reset-keys` ("back up
# config.toml and remove custom keybindings") strips every [keys] override below
# *and* these comments: `chezmoi apply` restores them, `chezmoi re-add` would
# commit the loss.

[theme]
# Almost certainly already the default — herdr's embedded default-config
# template ships `# name = "catppuccin"` commented out, the same convention it
# uses for the other defaults (`# onboarding = true`, `# auto_switch = false`),
# and "catppuccin" is the fallback string next to "unknown theme, falling back"
# in the binary. Not provable from the CLI, though: `herdr config check` does
# not validate theme names and there is no `config get`. Kept as a deliberate
# pin rather than deleted — the theme is user-visible and this is pre-1.0
# software that can change its default without it being obvious.
name = "catppuccin"

[keys]
prefix = "ctrl+a"
# Agent cycling on alt, not shift: prefix+shift+j/k are herdr's own defaults for
# swap_pane_down/swap_pane_up, and herdr resolves an explicit-vs-default clash by
# keeping the explicit binding and silently disabling the default — so binding
# agent cycling there left no key at all to move a pane within a layout.
# (`herdr config check` reports ok either way; it does not see this class of clash.)
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# Navigate mode: j/k drive the workspace list (muscle memory), which takes the
# keys away from navigate_pane_down/navigate_pane_up — those default to j/k too,
# and workspace wins the clash by priority, not by file order. So pane focus is
# rebound explicitly, otherwise navigate mode has no up/down pane movement at all.
# Navigate-mode shortcuts are mode-local: no `prefix+` element, same as j/k below.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "ctrl+k"
navigate_pane_down = "ctrl+j"

# Git worktree creation and path choice now belong to Worktrunk. Herdr's own
# worktree directory remains at its default for worktrees created from its UI;
# use `wt switch` to create a checkout in the configured nested layout, then
# open a herdr workspace in that checkout if desired.
