# ~/.config/tmux/tmux.conf

# --- Terminal & Colors ---
# No `default-terminal` here: tmux >= 3.1 already defaults to 'tmux-256color'
# (a stock `tmux -f /dev/null` server reports it), and tmux-sensible cannot
# downgrade it — its guard only fires when the value is literally `screen`,
# which no modern tmux reports. Setting it just restated the default.
#
# RGB     — true-colour passthrough.
# usstyle — undercurl + coloured underlines (LSP diagnostic squiggles in neovim).
#           The `tmux-256color` terminfo entry has no Smulx/Setulc, so tmux would
#           strip those escapes even though ghostty's own terminfo supports them;
#           `usstyle` adds both capabilities and passes the sequences through.
set-option -ga terminal-features ',*:RGB:usstyle'

# --- General Settings ---
# Prefix is tmux's stock C-b. herdr owns C-a, and herdr 0.7.5 has no
# send-prefix/passthrough action — so with tmux also on C-a, a tmux session
# started from inside a herdr pane (wtc, `sesh connect`) had an unreachable
# prefix and no escape hatch. Nesting is routine here, so tmux yields the key.
# (No `bind C-b send-prefix` needed — that is already tmux's default binding.)

set -g base-index 1                  # start indexing windows at 1
set -g detach-on-destroy off         # don't exit tmux when closing a session
# Kept rather than left to tmux-sensible: since tmux 3.5 the stock default is
# 10ms, and sensible's guard only acts when the value is still 500 — so on any
# modern tmux sensible never touches escape-time at all. 10ms is small but not
# zero, and neovim's <Esc> handling is noticeably crisper at 0.
set -g escape-time 0                 # zero-out escape time delay (important for neovim)
set -g history-limit 1000000         # increase history size
set -g renumber-windows on           # renumber all windows when any window is closed
set -g set-clipboard on              # use system clipboard
set -g status-position top           # status bar on top
set -g mouse on                      # enable mouse support
setw -g mode-keys vi                 # vi mode for copy mode

# --- Pane borders ---
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# --- Key Bindings ---
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# `L` above shadows tmux's default "switch to last session", which is worth
# keeping with one session per worktree and detach-on-destroy off. Restore it
# on a free key.
bind S switch-client -l

# --- Sesh (session manager) ---
# The "all" filter is on ^s, not fzf's usual ^a: herdr owns ctrl+a as its prefix
# and 0.7.5 has no send-prefix/passthrough action, so in the normal case here (a
# tmux session opened from inside a herdr pane) ctrl-a never reached fzf — it
# armed herdr's prefix and the following keystroke fired a herdr action instead.
# ^s is free of the other --bind entries below.
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^s all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-s:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# --- Plugins ---
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Plugin Settings ---
# Auto-restore: continuum saves the session layout every 15 min and reopens the
# last save when the tmux server starts fresh (e.g. after reboot / closing the
# terminal), so sessions survive across restarts.
set -g @continuum-restore 'on'

# --- Catppuccin Theme (Mocha) ---
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
# The zoom marker was previously an empty "()" — the glyph between the parens had
# been stripped, so zoomed windows rendered a bare pair of brackets. Plain text
# instead, so it renders regardless of font.
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, [Z],}"
set -g @catppuccin_directory_text " #{b:pane_current_path}"
set -g @catppuccin_date_time_text " %H:%M"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# Load catppuccin before setting status options (required for variables to be defined)
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_directory} "
set -ag status-right "#{E:@catppuccin_status_date_time}"

# --- Initialize TPM (keep this at the very bottom) ---
run '~/.config/tmux/plugins/tpm/tpm'
